name: Build And Release Bezels

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release metadata
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="release-${{ github.run_number }}-${short_sha}"
          title="Bezels ${tag}"

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$title" >> "$GITHUB_ENV"

      - name: Package bezel directories
        shell: bash
        run: |
          shopt -s nullglob dotglob
          mkdir -p dist

          for dir in bezels_*; do
            if [[ -d "$dir" ]]; then
              (
                cd "$dir"
                items=(*)

                if [[ ${#items[@]} -eq 0 ]]; then
                  echo "Skipping empty directory: $dir"
                  exit 0
                fi

                zip -qr "../dist/${dir}.zip" -- "${items[@]}"
              )
            fi
          done

          if ! compgen -G "dist/*.zip" > /dev/null; then
            echo "No bezels_* directories were found."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "$RELEASE_TITLE" \
            --notes "Automated release for commit $GITHUB_SHA."
